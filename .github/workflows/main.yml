
name: Build Shortcuts Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - "ShortcutsAndroid.zip"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Shortcuts APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP
        run: |
          test -f ShortcutsAndroid.zip || {
            echo "ERROR: ShortcutsAndroid.zip not found"
            exit 1
          }
          unzip -t ShortcutsAndroid.zip

      - name: Extract project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q ShortcutsAndroid.zip -d extracted

          PROJECT_DIR="$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find extracted -name settings.gradle -printf '%h\n' | head -n 1)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using: $SDKMANAGER"

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android packages
        shell: bash
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shortcuts-Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
